# fly.toml — generated for budget-tool
app = "budget-tool"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  DB_PATH = "/data/budget.db"

[mounts]
  source = "budget_data"
  destination = "/data"

[[services]]
  internal_port = 3001
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20
